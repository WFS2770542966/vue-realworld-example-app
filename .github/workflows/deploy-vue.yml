name: Deploy Vue RealWorld App
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 修复：用带编译工具的镜像 + 镜像源加速 + 权限优化
      - name: Build Vue project in Docker (fixed)
        uses: addnab/docker-run-action@v3
        with:
          # 用node:10-slim + 预装编译工具，完美兼容node-sass
          image: node:10-slim
          options: |
            --user root 
            -v ${{ github.workspace }}:/app 
            -w /app
            # 环境变量加速node-sass安装
            -e SASS_BINARY_SITE=https://npm.taobao.org/mirrors/node-sass/
            -e npm_config_registry=https://registry.npm.taobao.org/
          run: |
            # 安装编译依赖
            apt-get update && apt-get install -y python make g++
            # 安装项目依赖（加--unsafe-perm解决权限问题）
            npm install --unsafe-perm
            # 构建项目
            npm run build
            # 修复dist目录权限，确保宿主机能读取
            chmod -R 755 /app/dist
            chown -R 1001:1001 /app/dist

      # 部署步骤保持不变（已验证可靠）
      - name: Set folder permission
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VUE_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo chown -R ${{ secrets.SSH_USER_NAME }} /var/www/html

      - name: Copy dist files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VUE_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./dist/*"
          target: "/var/www/html"
          strip_components: 1

      - name: Restore root permission
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VUE_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo chown -R root:root /var/www/html