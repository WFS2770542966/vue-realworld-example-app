name: Deploy Vue RealWorld App
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 修复：单行options，避免格式解析错误
      - name: Build Vue project in Docker (fixed)
        uses: addnab/docker-run-action@v3
        with:
          image: node:10-slim
          # 改成单行格式，所有参数用空格分隔
          options: --user root -v ${{ github.workspace }}:/app -w /app -e SASS_BINARY_SITE=https://npm.taobao.org/mirrors/node-sass/ -e npm_config_registry=https://registry.npm.taobao.org/
          run: |
            apt-get update && apt-get install -y python make g++
            npm install --unsafe-perm
            npm run build
            chmod -R 755 /app/dist
            chown -R 1001:1001 /app/dist

      # 部署步骤保持不变
      - name: Set folder permission
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VUE_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo chown -R ${{ secrets.SSH_USER_NAME }} /var/www/html

      - name: Copy dist files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VUE_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./dist/*"
          target: "/var/www/html"
          strip_components: 1

      - name: Restore root permission
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VUE_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo chown -R root:root /var/www/html