name: Deploy Vue RealWorld App
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 修复工作目录 + 用旧环境编译老项目（完美兼容node-sass）
      - name: Build Vue project in Docker
        uses: addnab/docker-run-action@v3
        with:
          image: node:10
          options: --user root -v ${{ github.workspace }}:/app -w /app
          run: |
            npm install
            npm run build

      # 部署到服务器（不变）
      - name: Set folder permission
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VUE_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo chown -R ${{ secrets.SSH_USER_NAME }} /var/www/html

      - name: Copy dist files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VUE_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./dist/*"
          target: "/var/www/html"
          strip_components: 1

      - name: Restore root permission
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VUE_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo chown -R root:root /var/www/html